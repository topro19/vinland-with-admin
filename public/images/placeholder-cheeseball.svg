<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
    <radialGradient id="ballShading" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fae29a"/>
      <stop offset="70%" stop-color="#e5a823"/>
      <stop offset="100%" stop-color="#b87a0c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradBall)"/>
  <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="#e3d6be" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Shadow under cheese ball -->
  <ellipse cx="200" cy="235" rx="65" ry="16" fill="#4a3b1a" opacity="0.15"/>

  <!-- Round Cheese Ball (±900g bol) -->
  <circle cx="200" cy="175" r="58" fill="url(#ballShading)" stroke="#9c6403" stroke-width="2"/>
  
  <!-- Herb flecks / seasoning particles on cheese ball -->
  <circle cx="178" cy="150" r="2.5" fill="#2d4a22"/>
  <circle cx="218" cy="155" r="2" fill="#2d4a22"/>
  <circle cx="195" cy="180" r="3" fill="#2d4a22"/>
  <circle cx="170" cy="185" r="2" fill="#2d4a22"/>
  <circle cx="225" cy="188" r="2.5" fill="#2d4a22"/>
  <circle cx="190" cy="140" r="1.5" fill="#8c2e1b"/>
  <circle cx="210" cy="195" r="2" fill="#8c2e1b"/>
  <circle cx="185" cy="205" r="2.5" fill="#2d4a22"/>

  <!-- Red wax seal / label band across cheese ball -->
  <path d="M150 178 Q200 198 250 178" stroke="#a82313" stroke-width="7" fill="none" opacity="0.85"/>
  <circle cx="200" cy="188" r="11" fill="#a82313"/>
  <text x="200" y="192" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">900G</text>
  
  <!-- Text Label -->
  <text x="200" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#2d4a22" text-anchor="middle" letter-spacing="0.5">KRUIDENKAASBOLLETJE</text>
  <text x="200" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8c7355" text-anchor="middle">De Westplaat • Klik om foto te plaatsen</text>
  
  <!-- Camera icon badge -->
  <g transform="translate(186, 332)">
    <rect width="28" height="20" rx="4" fill="#2d4a22" opacity="0.12"/>
    <circle cx="14" cy="10" r="4.5" fill="none" stroke="#2d4a22" stroke-width="1.5"/>
    <circle cx="19" cy="7" r="1" fill="#2d4a22"/>
  </g>
</svg>